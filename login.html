<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alima CMS - Login</title>
  <link rel="stylesheet" href="design-system.css">
  <style>
    /* Fullscreen login styling */
    body {
      background-color: #0a0a1a;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #starfield {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Radial blobs */
    .blur-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.15;
    }

    .blob-purple {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #7c3aed 0%, rgba(124, 58, 237, 0) 70%);
      bottom: -100px;
      left: -100px;
      filter: blur(300px);
    }

    .blob-cyan {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
      top: -100px;
      right: -100px;
      filter: blur(250px);
    }

    /* Layout structure */
    .login-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 1100px;
      padding: 40px;
      z-index: 10;
      gap: 60px;
      align-items: center;
    }

    /* Left Branding Side */
    .left-branding {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .logo-char {
      font-size: 64px;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-heading);
    }

    .brand-title-v2 {
      font-family: var(--font-heading);
      font-size: 42px;
      font-weight: 800;
      color: #ffffff;
      margin-top: -12px;
    }

    .brand-tagline-v2 {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-top: -20px;
    }

    .features-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #e2e8f0;
      font-size: 0.95rem;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.5s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Right Form Card Side */
    .right-card-side {
      perspective: 1000px;
    }

    .glass-card-v2 {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
      position: relative;
      overflow: hidden;
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Tab switcher */
    .tabs-v2 {
      display: flex;
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .tab-btn-v2 {
      flex: 1;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      padding: 12px 0;
      cursor: pointer;
      text-align: center;
      transition: color var(--transition-normal);
      z-index: 2;
    }

    .tab-btn-v2.active {
      color: #ffffff;
    }

    .tabs-underline-v2 {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 50%;
      height: 2px;
      background: var(--gradient-primary);
      transition: transform var(--transition-normal);
      z-index: 1;
    }

    /* Form Panels Viewport */
    .viewport-container {
      overflow: hidden;
      width: 100%;
    }

    .viewport-v2 {
      display: flex;
      width: 200%;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .form-panel-v2 {
      width: 50%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Dark Input styling */
    .alima-input-dark {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding: 12px 0;
      color: white;
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-bottom-color var(--transition-normal);
    }

    .alima-input-dark:focus {
      border-bottom-color: var(--color-primary);
      box-shadow: 0 6px 12px -6px rgba(124, 58, 237, 0.2);
    }

    /* Password Input with eye icon */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .pwd-toggle-v2 {
      position: absolute;
      right: 0;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      font-size: 1rem;
      padding: 8px;
    }

    .pwd-toggle-v2:hover {
      color: white;
    }

    /* Strength meter */
    .strength-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: -8px;
    }

    .strength-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .strength-bar {
      width: 0%;
      height: 100%;
      background: var(--color-error);
      border-radius: var(--radius-pill);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .strength-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Separator */
    .separator-v2 {
      display: flex;
      align-items: center;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0;
    }

    .separator-v2::before, .separator-v2::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .separator-v2:not(:empty)::before { margin-right: 12px; }
    .separator-v2:not(:empty)::after { margin-left: 12px; }

    /* Success overlay */
    .success-overlay-v2 {
      position: absolute;
      inset: 0;
      background: #0a0a1a;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .success-overlay-v2.active {
      opacity: 1;
      pointer-events: all;
    }

    .success-ring-v2 {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid var(--color-success);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .checkmark-v2 {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--color-success);
    }

    .google-btn-v2 {
      background: white;
      color: #000000;
      font-family: var(--font-heading);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: var(--radius-pill);
      height: 52px;
      width: 100%;
      border: none;
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .google-btn-v2:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    /* Responsive adjustments */
    @media (max-width: 840px) {
      .login-container {
        grid-template-columns: 1fr;
        max-width: 480px;
        gap: 40px;
      }
      .left-branding {
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Particle Background Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Blurred color blobs -->
  <div class="blur-blob blob-purple"></div>
  <div class="blur-blob blob-cyan"></div>

  <!-- Primary Wrapper Container -->
  <div class="login-container">
    
    <!-- Left Branding Info -->
    <div class="left-branding">
      <div class="logo-circle">
        <span class="logo-char">A</span>
      </div>
      <div>
        <h1 class="brand-title-v2">alima</h1>
        <p class="brand-tagline-v2">The Foundation of Your Digital Campus</p>
      </div>

      <div class="features-list">
        <div class="feature-item" style="animation-delay: 0.1s;">
          <span>✦</span> Build beautiful websites in minutes
        </div>
        <div class="feature-item" style="animation-delay: 0.3s;">
          <span>✦</span> Drag & drop page builder
        </div>
        <div class="feature-item" style="animation-delay: 0.5s;">
          <span>✦</span> Custom domains & SEO tools
        </div>
      </div>
    </div>

    <!-- Right Interactive Card -->
    <div class="right-card-side">
      <div class="glass-card-v2" id="auth-card">
        
        <!-- Success Animation Ring Overlay -->
        <div class="success-overlay-v2" id="success-overlay">
          <div class="success-ring-v2">
            <span class="checkmark-v2">✓</span>
          </div>
        </div>

        <!-- Switch Tab Nav -->
        <div class="tabs-v2">
          <button class="tab-btn-v2 active" id="tab-login" onclick="switchFormTab('login')">Sign In</button>
          <button class="tab-btn-v2" id="tab-signup" onclick="switchFormTab('signup')">Create Account</button>
          <div class="tabs-underline-v2" id="tab-underline"></div>
        </div>

        <!-- Form Panels Viewport -->
        <div class="viewport-container">
          <div class="viewport-v2" id="forms-viewport">
            
            <!-- 1. SIGN IN PANEL -->
            <form class="form-panel-v2" id="login-form" onsubmit="handleAuthAction(event, 'login')">
              <div class="alima-input-group">
                <label class="alima-input-label">Campus Email</label>
                <input type="email" id="login-email" class="alima-input-dark" placeholder="you@university.edu" required>
              </div>

              <div class="alima-input-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <label class="alima-input-label">Password</label>
                  <a href="#" class="forgot-link" style="color: var(--color-primary); font-size: 0.8rem; text-decoration: none;" onclick="triggerPasswordReset(event)">Forgot password?</a>
                </div>
                <div class="password-wrapper">
                  <input type="password" id="login-pwd" class="alima-input-dark" placeholder="••••••••" required>
                  <button type="button" class="pwd-toggle-v2" onclick="togglePasswordInput('login-pwd')">👁️</button>
                </div>
              </div>

              <button type="submit" class="alima-btn btn-primary" style="height: 52px; width: 100%;">Sign In</button>

              <div class="separator-v2">or continue with</div>

              <button type="button" class="google-btn-v2" onclick="handleGoogleSignIn()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.34H12v4.44h6.44c-.28 1.48-1.12 2.73-2.38 3.58l3.7 2.87c2.16-2 3.4-4.94 3.4-8.55z"/>
                  <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.91l-3.7-2.87c-1.03.69-2.34 1.1-4.26 1.1-3.23 0-5.78-1.75-6.7-4.48L1.48 16.92C3.39 20.33 7.35 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.3 14.96c-.24-.72-.38-1.48-.38-2.27s.14-1.55.38-2.27L1.48 7.46C.54 9.36 0 11.53 0 12.8s.54 3.44 1.48 5.34l3.82-3.18z"/>
                  <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.67 1.57 15.01 1 12 1 7.35 1 3.39 3.67 1.48 7.56l3.82 2.96c.92-2.73 3.47-4.48 6.7-4.48z"/>
                </svg>
                Sign in with Google
              </button>
            </form>

            <!-- 2. CREATE ACCOUNT PANEL -->
            <form class="form-panel-v2" id="signup-form" onsubmit="handleAuthAction(event, 'signup')">
              <div class="alima-input-group">
                <label class="alima-input-label">Full Name</label>
                <input type="text" id="signup-name" class="alima-input-dark" placeholder="e.g. John Doe" required>
              </div>

              <div class="alima-input-group">
                <label class="alima-input-label">Campus Email</label>
                <input type="email" id="signup-email" class="alima-input-dark" placeholder="you@university.edu" required>
              </div>

              <div class="alima-input-group">
                <label class="alima-input-label">Password</label>
                <div class="password-wrapper">
                  <input type="password" id="signup-pwd" class="alima-input-dark" placeholder="Min 8 characters" oninput="checkPwdStrength(this.value)" required>
                  <button type="button" class="pwd-toggle-v2" onclick="togglePasswordInput('signup-pwd')">👁️</button>
                </div>
              </div>

              <!-- Password Strength Bar -->
              <div class="strength-wrapper">
                <div class="strength-bar-container">
                  <div class="strength-bar" id="strength-bar"></div>
                </div>
                <span class="strength-text" id="strength-label">Password Strength: Very Weak</span>
              </div>

              <div class="alima-input-group">
                <label class="alima-input-label">Confirm Password</label>
                <div class="password-wrapper">
                  <input type="password" id="signup-confirm" class="alima-input-dark" placeholder="••••••••" required>
                  <button type="button" class="pwd-toggle-v2" onclick="togglePasswordInput('signup-confirm')">👁️</button>
                </div>
              </div>

              <button type="submit" class="alima-btn btn-primary" style="height: 52px; width: 100%;">Create Account</button>
            </form>

          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Shared JS Utilities -->
  <script src="shared.js"></script>

  <!-- Firebase configuration import -->
  <script type="module" src="firebase.js"></script>

  <script type="module">
    import { auth, db, googleProvider } from "./firebase.js";
    import { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // 1. Particle System animation
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const numStars = 150;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        opacity: Math.random() * 0.6 + 0.3
      });
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x += s.vx;
        s.y += s.vy;

        if (s.x < 0) s.x = canvas.width;
        if (s.x > canvas.width) s.x = 0;
        if (s.y < 0) s.y = canvas.height;
        if (s.y > canvas.height) s.y = 0;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = s.opacity;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        for (let j = i + 1; j < stars.length; j++) {
          const s2 = stars[j];
          const dx = s.x - s2.x;
          const dy = s.y - s2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 100) {
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s2.x, s2.y);
            const alpha = (1 - dist / 100) * 0.15 * Math.min(s.opacity, s2.opacity);
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animateStars);
    }
    animateStars();

    // 2. Auth state observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });

    // 3. Form switcher tabs
    function switchFormTab(mode) {
      const underline = document.getElementById('tab-underline');
      const viewport = document.getElementById('forms-viewport');
      const tabs = document.querySelectorAll('.tab-btn-v2');

      if (mode === 'login') {
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
        underline.style.transform = 'translateX(0%)';
        viewport.style.transform = 'translateX(0%)';
      } else {
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
        underline.style.transform = 'translateX(100%)';
        viewport.style.transform = 'translateX(-50%)';
      }
    }

    function togglePasswordInput(id) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    // Password strength check
    function checkPwdStrength(val) {
      const bar = document.getElementById('strength-bar');
      const label = document.getElementById('strength-label');

      if (!val) {
        bar.style.width = '0%';
        label.textContent = 'Password Strength: Very Weak';
        return;
      }

      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (val.length < 6) {
        bar.style.width = '25%';
        bar.style.backgroundColor = 'var(--color-error)';
        label.textContent = 'Password Strength: Weak';
      } else if (score < 2) {
        bar.style.width = '50%';
        bar.style.backgroundColor = 'var(--color-warning)';
        label.textContent = 'Password Strength: Medium';
      } else {
        bar.style.width = '100%';
        bar.style.backgroundColor = 'var(--color-success)';
        label.textContent = 'Password Strength: Strong';
      }
    }

    // Forms actions handlers
    async function handleAuthAction(event, mode) {
      event.preventDefault();
      const card = document.getElementById('auth-card');
      const btn = event.submitter;
      const initialText = btn.textContent;

      if (mode === 'login') {
        const email = document.getElementById('login-email').value.trim();
        const pwd = document.getElementById('login-pwd').value.trim();

        try {
          btn.disabled = true;
          btn.innerHTML = `<span class="shimmer-skeleton" style="width: 24px; height: 24px; display: inline-block; border-radius: 50%;"></span>`;
          
          await signInWithEmailAndPassword(auth, email, pwd);
          triggerSuccessState(card, btn);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = initialText;
          shakeCard(card);
          AlimaToast.show("Authentication Failed", "Invalid campus email credentials or password.", "error");
        }
      } else {
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const pwd = document.getElementById('signup-pwd').value.trim();
        const confirmPwd = document.getElementById('signup-confirm').value.trim();

        if (pwd.length < 8) {
          AlimaToast.show("Validation Error", "Password must be at least 8 characters.", "error");
          return;
        }

        if (pwd !== confirmPwd) {
          AlimaToast.show("Validation Error", "Passwords do not match.", "error");
          return;
        }

        try {
          btn.disabled = true;
          btn.innerHTML = `<span class="shimmer-skeleton" style="width: 24px; height: 24px; display: inline-block; border-radius: 50%;"></span>`;

          const userCreds = await createUserWithEmailAndPassword(auth, email, pwd);
          const user = userCreds.user;
          await updateProfile(user, { displayName: name });
          
          // Save in users collection
          await setDoc(doc(db, "users", user.uid), {
            uid: user.uid,
            displayName: name,
            email: email,
            createdAt: new Date().toISOString()
          });

          // Log action
          await window.logActivity("Registered account");
          
          triggerSuccessState(card, btn);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = initialText;
          shakeCard(card);
          AlimaToast.show("Registration Failed", err.message || "An account could not be created.", "error");
        }
      }
    }

    async function handleGoogleSignIn() {
      const card = document.getElementById('auth-card');
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          displayName: user.displayName || user.email.split('@')[0],
          email: user.email,
          createdAt: new Date().toISOString()
        }, { merge: true });

        await window.logActivity("Signed in with Google");
        
        triggerSuccessState(card, document.querySelector('#login-form button[type="submit"]'));
      } catch (err) {
        shakeCard(card);
        AlimaToast.show("Google Sign In Failed", "Could not complete authentication with Google.", "error");
      }
    }

    async function triggerPasswordReset(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      if (!email) {
        AlimaToast.show("Email Required", "Please fill in your Campus Email field to request a reset link.", "warning");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        AlimaToast.show("Reset Link Sent", "Check your campus email inbox for instructions.", "success");
      } catch (err) {
        AlimaToast.show("Reset Error", "Failed to dispatch password reset request.", "error");
      }
    }

    function shakeCard(card) {
      card.classList.remove('shake-error');
      void card.offsetWidth;
      card.classList.add('shake-error');
    }

    function triggerSuccessState(card, btn) {
      if (btn) {
        btn.style.backgroundColor = 'var(--color-success)';
        btn.style.backgroundImage = 'none';
        btn.textContent = '✓ Success';
      }
      
      const overlay = document.getElementById('success-overlay');
      overlay.classList.add('active');

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    }

    window.switchFormTab = switchFormTab;
    window.togglePasswordInput = togglePasswordInput;
    window.checkPwdStrength = checkPwdStrength;
    window.handleAuthAction = handleAuthAction;
    window.handleGoogleSignIn = handleGoogleSignIn;
    window.triggerPasswordReset = triggerPasswordReset;
  </script>
</body>
